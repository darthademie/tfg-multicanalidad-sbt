apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleupm-sbt-deployment
  namespace: apps
  labels:
    app: teleupm-sbt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleupm-sbt
  template:
    metadata:
      labels:
        app: teleupm-sbt
    spec:
      containers:
      - name: sbt-worker
        image: darthademie/tfg-multicanalidad-sbt:1.16
        imagePullPolicy: Always
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        envFrom:
        - secretRef:
            name: teleupm-analytics-secret
        volumeMounts:
        - name: keys-volume
          mountPath: /app/keys
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: keys-volume
        secret:
          secretName: teleupm-keys-secret